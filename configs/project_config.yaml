# Kavli xIV-LDDMM project setup
# =================================
# On Dalet, edit project.root once. All relative paths below resolve from that root.
# Absolute paths are also accepted. ~ and $HOME are expanded.
project:
  root: ".."
  name: "Kavli Allen-SEA-AD xIV-LDDMM"

software:
  # Prefer the colleague's exact repository/commit for first reproduction. The public
  # repository currently uses the "unpack" branch.
  xiv_lddmm_repository: "legacy"

  # Reference checkout; not used by the runtime loader.
  xiv_lddmm_upstream_reference: "vendor/xIV-LDDMM-Particle"

# Coordinate-space registry. These names become metadata in particle NPZ files.
# They are assertions to be verified, not substitutes for header/transform QC.
spaces:
  ding_raw_native:
    description: >-
      Native coordinate convention of the original Allen/Ding donor images. Raw files
      may not share one voxel grid; inspect affines and documentation.
  ding_openneuro_subject:
    description: >-
      ds003590 reconstructed MRI/Nissl/parvalbumin subject space at 0.25 mm isotropic.
      This is the same Allen donor/reference lineage as the Ding material, but exact
      grid equivalence must still be checked file by file.
  mni_icbm2009b_symmetric:
    description: >-
      MNI ICBM 2009b nonlinear symmetric population-template space used by the Allen
      Human Reference Atlas 3-D, 2020. This is not a single-donor native space.
  seaad_donor_native:
    description: >-
      Placeholder for a SEA-AD donor-native/slab/block/section coordinate hierarchy.

# Informational data roots. Download scripts can target these directories.
datasets:
  ding_imaging:
    root: "data/raw/ding_imaging"
    coordinate_space: "ding_raw_native"
  openneuro_ds003590:
    root: "data/raw/openneuro/ds003590"
    coordinate_space: "ding_openneuro_subject"
    notes: >-
      The reconstructed subject-space outputs and MNI-space mappings should be kept
      distinct in filenames and metadata.
  allen_human_reference_atlas_3d_2020:
    root: "data/raw/allen_hra_3d_2020"
    coordinate_space: "mni_icbm2009b_symmetric"
    notes: >-
      Parcellation was drawn on ICBM 2009b nonlinear symmetric and adapts Ding's prior
      2-D atlas/ontology; it is not the Ding donor anatomy itself.
  sea_ad:
    root: "data/raw/sea_ad"
    coordinate_space: "seaad_donor_native"

# Feature maps from integer segmentation labels to fine and coarse particle features.
# Fine features are columns of nu_All. Each group is one column of nu_Sub.
label_maps:
  legacy_target_5labels:
    groups:
      - name: "amygdala"
        labels:
          - {id: 1, name: "amygdala"}
      - name: "entorhinal_temporal"
        labels:
          - {id: 2, name: "entorhinal"}
          - {id: 3, name: "temporal_extension"}
      - name: "hippocampal_formation"
        labels:
          - {id: 4, name: "hippocampal_subfield_1"}
          - {id: 5, name: "hippocampal_subfield_2"}

  legacy_brain7_three_regions:
    groups:
      - name: "amygdala"
        labels:
          - {id: 12, name: "amygdala_12"}
          - {id: 11, name: "amygdala_11"}
          - {id: 13, name: "amygdala_13"}
          - {id: 14, name: "amygdala_14"}
      - name: "entorhinal_perirhinal"
        labels:
          - {id: 9, name: "entorhinal"}
          - {id: 17, name: "perirhinal"}
      - name: "hippocampal_formation"
        labels:
          - {id: 15, name: "dentate_gyrus"}
          - {id: 16, name: "endfolial"}
          - {id: 8, name: "hilus"}
          - {id: 2, name: "hippocampal_2"}
          - {id: 3, name: "hippocampal_3"}
          - {id: 4, name: "hippocampal_4"}
          - {id: 5, name: "hippocampal_5"}
          - {id: 6, name: "hippocampal_6"}
          - {id: 7, name: "hippocampal_7"}

  # Useful for inventory/QC of an atlas annotation. It makes one feature per nonzero
  # integer. Do not use it for SingleModality across different ontologies unless the
  # feature IDs and order have been explicitly harmonized.
  infer_all_labels:
    infer_all_nonbackground: true

  # AHRAv2 gyral annotation values are Allen *compressed* codes. Decode them with
  # data/raw/allen/ahrav2/2025/ahrav2_homba_terminology_2025.csv (annotation_value).
  # Code 30 = HOMBA:12141; its 415,406 voxels match ahrav2_gyral_parcellation_volumes_500um.csv.
  ahrav2_gyral_mtg:
    groups:
      - name: "middle_temporal_gyrus"
        labels:
          - {id: 30, name: "middle temporal gyrus (HOMBA:12141)"}

particle_jobs:
  sources:
    # Replace input_nifti with the segmentation/annotation you intend to use. Raw MRI,
    # dMRI, Nissl, and parvalbumin images are not label images.
    ding_subject_source:
      enabled: false
      input_nifti: "data/processed/segmentations/ding_subject_labels.nii.gz"
      output_dir: "data/processed/particles/sources/ding_subject"
      coordinate_space: "ding_openneuro_subject"
      coordinate_mode: "affine_world"
      construction_backend: "project_affine_block"
      vtk_coordinate_convention: "xyz"
      label_map: "infer_all_labels"
      background_labels: [0]
      downsample_factors: [1, 5]
      write_vtk: true
      notes: >-
        First use a small validated ROI. Replace infer_all_labels with a biologically
        defined feature crosswalk before registering to another dataset.

    allen_hra_mni_source:
      enabled: false
      input_nifti: "data/raw/allen_hra_3d_2020/annotation.nii.gz"
      output_dir: "data/processed/particles/sources/allen_hra_mni"
      coordinate_space: "mni_icbm2009b_symmetric"
      coordinate_mode: "affine_world"
      construction_backend: "project_affine_block"
      vtk_coordinate_convention: "xyz"
      label_map: "infer_all_labels"
      background_labels: [0]
      downsample_factors: [1, 5]
      write_vtk: true
      notes: >-
        Whole-brain full-resolution particles may be very large. Crop to an ROI or use
        a reduced representation for initial tests.

    legacy_brain7_source:
      enabled: false
      input_nifti: "data/legacy/labelsTr_reorient_3label/brain7.nii.gz"
      output_dir: "data/processed/particles/sources/legacy_brain7"
      coordinate_space: "legacy_reoriented_subject"
      coordinate_mode: "legacy_centered"
      construction_backend: "project_affine_block"
      vtk_coordinate_convention: "xyz"
      label_map: "legacy_brain7_three_regions"
      background_labels: [0]
      downsample_factors: [1, 5]
      write_vtk: true

    # Bilateral 3-D MTG particles at native 0.5 mm; one particle per voxel (0.125 mm^3).
    ahrav2_gyral_mtg:
      enabled: true
      input_nifti: "data/raw/allen/ahrav2/2025/ahrav2_gyral_annotations_500um.nii.gz"
      output_dir: "data/derivatives/allen/ahrav2_2025/particles/gyral_mtg"
      coordinate_space: "mni_icbm2009b_symmetric"
      coordinate_mode: "affine_world"
      construction_backend: "project_affine_block"
      vtk_coordinate_convention: "xyz"
      label_map: "ahrav2_gyral_mtg"
      background_labels: [0]
      downsample_factors: [1]
      write_vtk: true
      notes: >-
        AHRAv2 2025 gyral annotation (Allen compressed codes); code 30 decoded with the
        HOMBA 2025 terminology. Both hemispheres share the code.

  targets:
    example_target:
      enabled: false
      input_nifti: "data/processed/segmentations/example_target_labels.nii.gz"
      output_dir: "data/processed/particles/targets/example"
      coordinate_space: "ding_openneuro_subject"
      coordinate_mode: "affine_world"
      construction_backend: "project_affine_block"
      vtk_coordinate_convention: "xyz"
      label_map: "infer_all_labels"
      background_labels: [0]
      downsample_factor: 1
      write_vtk: true

    legacy_adni_targets:
      enabled: false
      input_glob: "data/legacy/labelsTr/*.nii.gz"
      output_dir: "data/processed/particles/targets/legacy_adni"
      coordinate_space: "legacy_reoriented_subject"
      coordinate_mode: "legacy_centered"
      construction_backend: "xmodmap_native"
      vtk_coordinate_convention: "xyz"
      label_map: "legacy_target_5labels"
      background_labels: [0]
      downsample_factor: 1
      write_vtk: true

registrations:
  # This is a template. Source and target feature columns must have identical meaning.
  ding_subject_test:
    source_particles: "data/processed/particles/sources/ding_subject/ding_subject_labels_ds5.npz"
    target_particles: "data/processed/particles/targets/example/example_target_labels_ds1.npz"
    full_target_particles: "data/processed/particles/targets/example/example_target_labels_ds1.npz"
    output_dir: "results/registrations/ding_subject_test"
    feature_key: "nu_Sub"
    report_feature_key: "nu_All"
    allow_space_mismatch: false
    vtk_coordinate_convention: "xyz"
    model:
      seed: 0
      device: "cpu"          # e.g. cuda:0 after validating the environment
      torch_dtype: "float32"
      effective_dimension: 3
      isotropic_scale: true
      sigma_rkhs: [0.20, 0.10, 0.05]
      sigma_var: [0.20, 0.05, 0.02]
      steps: 250
      shooting_time_steps: 10
      gamma: 0.01
      c_rotation: 1.0
      c_translation: 1.0
      c_nonrigid: 5.0
      data_loss_weight: 1.0
      precondition_scale: 1.0
      center_source: false
      center_target: false

  # Deliberately disabled conceptually: HRA and subject particles are in different
  # spaces and may have different feature ontologies. First use ds003590's documented
  # MNI mapping or a separate cross-modal/atlas-registration stage.
  allen_hra_to_ding_NOT_READY:
    source_particles: "data/processed/particles/sources/allen_hra_mni/annotation_ds5.npz"
    target_particles: "data/processed/particles/targets/example/example_target_labels_ds1.npz"
    output_dir: "results/registrations/allen_hra_to_ding_not_ready"
    feature_key: "nu_Sub"
    report_feature_key: "nu_All"
    allow_space_mismatch: false
    vtk_coordinate_convention: "xyz"
    model:
      seed: 0
      device: "cpu"
      torch_dtype: "float32"
      sigma_rkhs: [0.20, 0.10, 0.05]
      sigma_var: [0.20, 0.05, 0.02]
      steps: 50

  # ---------------------------------------------------------------------------------
  # Atlas plane -> MERFISH section, cross-modal with density-support censoring.
  # Run by src/scripts/framework_script_AtlasToSectionCrossModalBoundary.py.
  # Lengths ending in _mm are physical; the script divides them by makePQ's joint
  # scale s to get xmodmap's unit-box values. lamb_init is held fixed: in 2-D the
  # density-only support weight does not depend on lambda.
  # Initialization ids: rDDD = target rotation in degrees, f1 = target reflected
  # (y -> -y) before rotation. Reflection is preprocessing, not part of the flow.
  # ---------------------------------------------------------------------------------
  ahrav2_mtg_plane_to_strip_1194111462:
    source_particles: "data/derivatives/allen/ahrav2_2025/particles/gyral_mtg/ahrav2_gyral_mtg_coronal_y-30mm_L.npz"
    target_particles: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/binned_500um_classes_depth_strip.npz"
    qc_strip_cells: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/qc_depth_strip_cells.npz"
    output_dir: "results/registrations/ahrav2_mtg_plane_to_strip_1194111462"
    feature_key: "nu_Sub"
    target_feature_mode: "classes"
    vtk_coordinate_convention: "xyz"
    reference_initialization: "r000_f0"
    initializations: &atlas_section_initializations
      [r000_f0, r090_f0, r180_f0, r270_f0, r000_f1, r090_f1, r180_f1, r270_f1]
    model: &atlas_section_boundary_model
      seed: 0
      device: "cuda:0"       # must equal the default device legacy xmodmap sets on import
      torch_dtype: "float32"
      sigma_rkhs_mm: [2.0, 1.0, 0.5]
      sigma_var_mm: [2.0, 1.0, 0.5]
      dens_sigma_mm: 1.0
      score_sigmas_mm: [2.0, 1.0, 0.5]
      steps: 150
      shooting_time_steps: 10
      gamma: 0.1
      c_rotation: 1.0
      c_translation: 1.0
      c_nonrigid: 10.0
      csqpi: 10000.0
      csqlamb: 100.0
      eta0: 0.4472135955     # sqrt(0.2), as in the densSupport example
      lamb_init: 0.4
      precondition_scale: 1.0

  # Same model and start; target collapsed to total mass and pi fixed to identity.
  ahrav2_mtg_plane_to_strip_1194111462_geometry_only:
    source_particles: "data/derivatives/allen/ahrav2_2025/particles/gyral_mtg/ahrav2_gyral_mtg_coronal_y-30mm_L.npz"
    target_particles: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/binned_500um_classes_depth_strip.npz"
    qc_strip_cells: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/qc_depth_strip_cells.npz"
    output_dir: "results/registrations/ahrav2_mtg_plane_to_strip_1194111462_geometry_only"
    feature_key: "nu_Sub"
    target_feature_mode: "total_mass"
    vtk_coordinate_convention: "xyz"
    reference_initialization: "r000_f0"
    initializations: *atlas_section_initializations
    model: *atlas_section_boundary_model

  # Engineering stress test only: censoring the source does not remove the white
  # matter and non-MTG tissue in the target, so this fit is not interpreted.
  ahrav2_mtg_plane_to_fullsection_1194111462:
    source_particles: "data/derivatives/allen/ahrav2_2025/particles/gyral_mtg/ahrav2_gyral_mtg_coronal_y-30mm_L.npz"
    target_particles: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/binned_500um_classes.npz"
    qc_strip_cells: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/qc_depth_strip_cells.npz"
    output_dir: "results/registrations/ahrav2_mtg_plane_to_fullsection_1194111462"
    feature_key: "nu_Sub"
    target_feature_mode: "classes"
    vtk_coordinate_convention: "xyz"
    reference_initialization: "r000_f0"
    initializations: *atlas_section_initializations
    model: *atlas_section_boundary_model

  # QNP H20.33.034 MTG consensus (gray/white) <- AHRAv2 tissue-class planes exported by
  # scan_atlas_planes_for_qnp.py --stage export.  The scan left two competing basins
  # tied within stain-replicate noise, so both are fitted with one model: A (coronal,
  # y -27.5, annotated ribbon on MTG) and B (pitch/yaw +15, y -62.5, ribbon on fusiform).
  # Inputs are already in the atlas plane frame (rigid scan placement), so they share
  # one center; pi_ST is 2x2 and should stay near-diagonal (gray/white on both sides).
  ahrav2_tissue_plane_to_qnp_H20.33.034_MTG_A:
    source_particles: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/p+000_w+000_y-027.5/ahrav2_tissue_plane.npz"
    target_particles: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/p+000_w+000_y-027.5/qnp_consensus_500um_in_plane.npz"
    qc_strip_cells: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/p+000_w+000_y-027.5/qnp_ribbon_points_in_plane.npz"
    output_dir: "results/registrations/ahrav2_tissue_plane_to_qnp_H20.33.034_MTG_A"
    feature_key: "nu_Sub"
    target_feature_mode: "classes"
    target_coordinate_space: "qnp_local_in_atlas_plane_mm"
    center_mode: "shared_target"
    vtk_coordinate_convention: "xyz"
    reference_initialization: "r000_f0"
    initializations: *atlas_section_initializations
    model: *atlas_section_boundary_model

  ahrav2_tissue_plane_to_qnp_H20.33.034_MTG_B:
    source_particles: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/p+015_w+015_y-062.5/ahrav2_tissue_plane.npz"
    target_particles: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/p+015_w+015_y-062.5/qnp_consensus_500um_in_plane.npz"
    qc_strip_cells: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/p+015_w+015_y-062.5/qnp_ribbon_points_in_plane.npz"
    output_dir: "results/registrations/ahrav2_tissue_plane_to_qnp_H20.33.034_MTG_B"
    feature_key: "nu_Sub"
    target_feature_mode: "classes"
    target_coordinate_space: "qnp_local_in_atlas_plane_mm"
    center_mode: "shared_target"
    vtk_coordinate_convention: "xyz"
    reference_initialization: "r000_f0"
    initializations: *atlas_section_initializations
    model: *atlas_section_boundary_model

# Groupings of categorical feature labels into coarser named features. Every input
# label must appear in exactly one group or in drop.
feature_groupings:
  seaad_merfish_subclass_classes:
    groups:
      excitatory: ["L2/3 IT", "L4 IT", "L5 ET", "L5 IT", "L5/6 NP", "L6 CT", "L6 IT",
                   "L6 IT Car3", "L6b"]
      inhibitory: ["Chandelier", "Lamp5", "Lamp5 Lhx6", "Pax6", "Pvalb", "Sncg", "Sst",
                   "Sst Chodl", "Vip"]
      astrocyte: ["Astrocyte"]
      oligodendrocyte: ["Oligodendrocyte"]
      opc: ["OPC"]
      microglia_pvm: ["Microglia-PVM"]
      vascular: ["Endothelial", "VLMC"]
    drop: ["__missing__"]

# Inputs for src/scripts/prepare_atlas_plane_and_section.py: one provisional atlas
# plane and the matching compressed MERFISH targets.
atlas_section_inputs:
  ahrav2_mtg_coronal_L_to_1194111462:
    atlas:
      particles: "data/derivatives/allen/ahrav2_2025/particles/gyral_mtg/ahrav2_gyral_annotations_500um_ds1.npz"
      annotation_nifti: "data/raw/allen/ahrav2/2025/ahrav2_gyral_annotations_500um.nii.gz"
      template_nifti: "data/raw/allen/ahrav2/2025/ahrav2_icbm2009b_symmetric_template_500um.nii.gz"
      terminology_csv: "data/raw/allen/ahrav2/2025/ahrav2_homba_terminology_2025.csv"
      parcellation_volumes_csv: "data/raw/allen/ahrav2/2025/ahrav2_gyral_parcellation_volumes_500um.csv"
      label_id: 30
      expected_name: "middle temporal gyrus"
      # Provisional initialization, not a claim about where the section was cut.
      plane:
        origin_mm: [0.0, -30.0, 0.0]
        u_axis: [1.0, 0.0, 0.0]
        v_axis: [0.0, 0.0, 1.0]
        half_thickness_mm: 0.25
        hemisphere: "left"
      output_npz: "data/derivatives/allen/ahrav2_2025/particles/gyral_mtg/ahrav2_gyral_mtg_coronal_y-30mm_L.npz"
    section:
      full_npz: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/full_section_particles.npz"
      full_labels_json: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/sections.json"
      strip_npz: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/depth_strip_mass_is_depth_um.npz"
      coordinate_scale: 0.001   # X_spatial_raw um -> mm (checked by nearest-neighbour spacing)
      bin_mm: 0.5
      feature_grouping: "seaad_merfish_subclass_classes"
      full_output_npz: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/binned_500um_classes.npz"
      strip_output_npz: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/binned_500um_classes_depth_strip.npz"
      strip_cells_npz: "data/derivatives/sea-ad/merfish/H20.33.001/MTG/1194111462/qc_depth_strip_cells.npz"
    qc_dir: "results/qc/atlas_section/ahrav2_mtg_coronal_L_to_1194111462"

# Dense scalar-image particles.  The xmodmap-native backend is retained for exact
# legacy-style experiments; Allen production jobs use the affine/block extension.
dense_image_particle_jobs:
  legacy_brain7_t2_xmodmap_native:
    enabled: false
    input_nifti: "data/legacy/imagesTr_reorient/brain7_0000.nii.gz"
    output_dir: "data/processed/particles/dense/legacy_brain7_t2"
    coordinate_space: "legacy_reoriented_subject"
    coordinate_mode: "legacy_centered"
    construction_backend: "xmodmap_native"
    vtk_coordinate_convention: "xyz"
    downsample_factors: [1]
    load_scaled: false
    mask: {mode: "positive"}
    intensity:
      normalization: "uint8_legacy"
      clip: true
    histogram:
      enabled: true
      bins: 256
      reverse: false
    write_vtk: true
    write_legacy_t2_alias: true
    notes: >-
      Uses xmodmap.io.getInput.makeBinsFromMultiChannelImage for nu_bin.  It is
      intentionally limited to native sampling and centered coordinates.

  ding_7t_t1_example:
    enabled: false
    input_nifti: "data/raw/ding_imaging/REPLACE_WITH_7T_T1.nii.gz"
    mask_nifti: null
    output_dir: "data/processed/particles/dense/ding_7t_t1"
    coordinate_space: "ding_raw_native"
    coordinate_mode: "affine_world"
    construction_backend: "project_affine_block"
    vtk_coordinate_convention: "xyz"
    position_mode: "block_center"
    downsample_factors: [5]
    load_scaled: true
    mask: {mode: "positive"}
    intensity:
      normalization: "robust_minmax"
      lower_quantile: 0.01
      upper_quantile: 0.99
      clip: true
    histogram:
      enabled: true
      bins: 64
      assignment: "linear"
    write_vtk: true
    write_legacy_t2_alias: false
    notes: >-
      Start with a validated ROI and explicit tissue mask.  The project backend is used
      because xmodmap's native image converter does not preserve the complete NIfTI
      affine and its stride downsampling is not a 3-D mass-conserving aggregation.

particle_reconstruction_jobs:
  ding_7t_t1_roundtrip_example:
    particle_file: "data/processed/particles/dense/ding_7t_t1/REPLACE_intensity_ds5.npz"
    coordinate_key: "X"
    feature_key: "nu_intensity"
    mode: "scalar"
    reference_nifti: "data/raw/ding_imaging/REPLACE_WITH_7T_T1.nii.gz"
    output_nifti: "results/qc/ding_7t_t1_roundtrip.nii.gz"
    interpolation:
      method: "gaussian_knn"
      k: 8
      sigma_mm: 0.25
      support_radius_mm: 1.0
      chunk_size: 200000
      minimum_weight: 1.0e-8
    write_mass_image: true
    write_support_mask: true


# ---------------------------------------------------------------------------------
# SEA-AD QNP slides -> 2-D particles -> within-QNP alignment -> AHRAv2 plane scan.
# Run by src/scripts/prepare_qnp_section_particles.py, align_qnp_multistain.py and
# scan_atlas_planes_for_qnp.py (see their docstrings).  Section order and spacing within
# the block are undocumented, so slides stay independent 2-D objects (no z).
# ---------------------------------------------------------------------------------
qnp_section_inputs:
  H20.33.034_MTG:
    region: "middle-temporal-gyrus"
    slide_dir: "data/raw/sea-ad/qnp/middle-temporal-gyrus/H20.33.034"
    pyramid_level: -1            # smallest Aperio level, ~8 um/pixel
    # Gray/white separation feature per stain.  red_od_share = red-channel share of
    # optical density (myelin/LFB-blue and hematoxylin-rich white matter high).
    # structural: used in the gray/white consensus; others are carried as features only.
    stains:
      NEUN: {feature: "red_od_share", wm_high: true, structural: true}
      LFB:  {feature: "red_od_share", wm_high: true, structural: true}
      AT:   {feature: "red_od_share", wm_high: true, structural: true}
      ASYN: {feature: "red_od_share", wm_high: true, structural: false}  # ribbon p_wm 0.14-0.35, separability 0.57
      GFAP: {feature: "red_od_share", wm_high: true, structural: false}
      I6:   {feature: "red_od_share", wm_high: true, structural: false}  # layer 1 classified as white (p_wm 0.84)
    reference_stain: "NEUN"      # defines the donor-local QNP frame (HALO layers came from NeuN)
    annotation_misfit: ["GFAP", "AT"]  # HALO ribbon <90% on own tissue (inventory: 36%, 73%)
    annotation_on_tissue_min: 0.9
    smoothing_um: 100.0
    membership_softness: 0.05
    membership_edge_exclusion_um: 300.0   # fit the gray/white split away from the stained rim
    bins_mm: [1.0, 0.5]
    od_bins: 8
    ribbon_point_step_px: 4
    particle_dir: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034"
    qc_dir: "results/qc/qnp/H20.33.034_MTG"
    alignment:
      output_dir: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned"
      search_bin_tag: "1000um"
      refine_bin_tag: "500um"
      theta_step_deg: 10
      refine_top: 4
      score_sigmas_mm: [2.0, 1.0, 0.5]
      consensus_min_votes: 2
      grid_pad_px: 60
    # AHRAv2 plane scan (src/scripts/scan_atlas_planes_for_qnp.py).  Gray matter = every
    # non-zero gyral-annotation code that is neither white matter nor dropped.
    atlas_scan:
      annotation_nifti: "data/raw/allen/ahrav2/2025/ahrav2_gyral_annotations_500um.nii.gz"
      template_nifti: "data/raw/allen/ahrav2/2025/ahrav2_icbm2009b_symmetric_template_500um.nii.gz"
      terminology_csv: "data/raw/allen/ahrav2/2025/ahrav2_homba_terminology_2025.csv"
      fine_regions:   # first entry is the target region; codes checked against the terminology
        MTG: {codes: [30], expected_name: "middle temporal gyrus"}
        STG: {codes: [29], expected_name: "superior temporal gyrus"}
        ITG: {codes: [31], expected_name: "inferior temporal gyrus"}
        FuG: {codes: [2032], expected_name: "fusiform (occipitotemporal) gyrus"}
      white_matter_codes: [220, 222, 223, 224, 231, 233, 234, 235, 239, 244, 245, 246, 247, 249, 251, 253,
                           367, 369, 370, 372, 374, 378, 464, 465, 468, 471, 473, 474, 475, 476, 477,
                           1792, 1819, 1829, 2049, 2442, 2481]
      drop_codes: [258, 259, 260, 261, 262, 264, 270, 332, 382, 482, 483, 1756, 1765, 2047, 2426]
      hemisphere: "left"           # atlas is symmetric; reflection is searched
      half_width_mm: 35.0          # in-plane window around the left-MTG centroid
      reslice_mm: 0.5              # = atlas voxel size
      scan_bin_mm: 1.0             # atlas plane aggregated 2x2 for the scan
      y_range_mm: [-70.0, 10.0]
      y_step_mm: 2.5
      pitch_deg: [-15, 0, 15]
      yaw_deg: [-15, 0, 15]
      theta_step_deg: 15
      scale_grid: [0.9, 1.05, 1.2, 1.35]
      scale_bounds: [0.8, 1.5]     # atlas mm per QNP mm: shrinkage x template size x atrophy
      fft_grid_mm: 1.0
      fft_blur_mm: 1.5
      refine_top: 2
      max_evals: 150
      score_sigmas_mm: [2.0, 1.0, 0.5]
      workers: 10
      ribbon_points: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/H20.33.034-A07-NEUN_ribbon_points.npz"
      ribbon_subsample: 10
      primary_representation: "consensus_gmwm"
      replicate_representations: ["NEUN_gmwm", "LFB_gmwm", "AT_gmwm"]
      noise_top_planes: 20
      representations:
        consensus_gmwm:
          particles: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned/consensus_NEUN_LFB_AT_tissue_classes_1000um.npz"
          features: "gmwm"
        consensus_tissue:   # silhouette only: the analogue of the MERFISH single-label pilot
          particles: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned/consensus_NEUN_LFB_AT_tissue_classes_1000um.npz"
          features: "tissue"
        NEUN_gmwm:
          particles: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned/H20.33.034-A07-NEUN_tissue_classes_1000um_local.npz"
          features: "gmwm"
        LFB_gmwm:
          particles: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned/H20.33.034-A7-LFB_tissue_classes_1000um_local.npz"
          features: "gmwm"
        AT_gmwm:
          particles: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned/H20.33.034-A7-AT_tissue_classes_1000um_local.npz"
          features: "gmwm"
      output_dir: "results/registrations/qnp_H20.33.034_MTG_atlas_plane_scan"
      export:
        bin_mm: 0.5
        target_particles: "data/derivatives/sea-ad/qnp/particles/middle-temporal-gyrus/H20.33.034/aligned/consensus_NEUN_LFB_AT_tissue_classes_500um.npz"
        support_sigma_mm: 2.0
        support_min_weight: 0.05
        # {plane_id} is filled by --stage export (best plane, or --plane).
        source_npz: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/{plane_id}/ahrav2_tissue_plane.npz"
        target_npz: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/{plane_id}/qnp_consensus_500um_in_plane.npz"
        qc_points_npz: "data/derivatives/sea-ad/qnp/registration_inputs/H20.33.034_MTG/{plane_id}/qnp_ribbon_points_in_plane.npz"
      # Search-robustness re-check around the two competing minima of the coarse scan
      # (coronal y -27.5 and pitch/yaw +15 y -62.5): finer rotation grid, more refined
      # candidates and evaluations.  Planes: [pitch, yaw, [y0 values]].
      dense_search:
        theta_step_deg: 7.5
        scale_grid: [0.85, 0.95, 1.05, 1.15, 1.25, 1.35]
        refine_top: 6
        max_evals: 300
        planes:
          - [0, 0, [-35.0, -32.5, -30.0, -27.5, -25.0, -22.5, -20.0]]
          - [15, 15, [-70.0, -67.5, -65.0, -62.5, -60.0, -57.5, -55.0]]
          # 0.5 mm steps across each minimum: basin width
          - [0, 0, [-29.5, -29.0, -28.5, -28.0, -27.0, -26.5, -26.0, -25.5]]
          - [15, 15, [-64.5, -64.0, -63.5, -63.0, -62.0, -61.5, -61.0, -60.5]]
        representations: ["consensus_gmwm", "NEUN_gmwm", "LFB_gmwm", "AT_gmwm"]
