[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seaad-mtg"
version = "0.1.0"
description = "Docker-runnable SEA-AD MTG crosswalk and linkage pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.10",
  "boto3>=1.34",
  "h5py>=3.10",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "scipy>=1.11",
]

[project.scripts]
seaad-mtg = "seaad_mtg.cli:main"
seaad-omics-inventory = "acquisition.fetch_seaad_omics_inventory:main"
seaad-omics-download = "cli.omics_download:main"
seaad-omics-inspect = "cli.omics_inspect:main"
seaad-omics-prepare = "cli.omics_prepare:main"
seaad-omics-extract-genes = "cli.omics_extract_genes:main"
seaad-omics-build-signature-registry = "cli.omics_build_signature_registry:main"
seaad-omics-state-scores = "cli.omics_state_scores:main"
seaad-omics-competitive-scores = "cli.omics_competitive_scores:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["seaad_mtg*", "acquisition*", "omics*", "cli*"]

[tool.setuptools.package-data]
seaad_mtg = ["bundled_scripts/*.py"]
acquisition = ["selections/*.json", "selections/*.csv"]
