[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seaad-mtg"
version = "0.1.0"
description = "Docker-runnable SEA-AD MTG crosswalk and linkage pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.10",
  "boto3>=1.34",
  "h5py>=3.10",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "scipy>=1.11",
]

[project.scripts]
seaad-mtg = "seaad_mtg.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
seaad_mtg = ["bundled_scripts/*.py"]
